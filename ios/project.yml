name: Spike
options:
  bundleIdPrefix: dev.de0ch
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    EX_ENABLE_EXTENSION_POINT_GENERATION: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host, Shared]
    dependencies:
      - target: Extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.shellspike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  Extension:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: Extension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.shellspike.ui
        PRODUCT_NAME: JarvisUI
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Extension/Info.plist
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
  HostUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.shellspike.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Host
schemes:
  Host:
    build:
      targets:
        Host: all
    test:
      config: Release
      targets: [HostUITests]
